    font-family: "Public Sans"; font-style: normal; font-weight: 100 900; font-display: swap;

    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

  :root {
    --navy: #0F384D;
    --teal: #00767C;
    --aqua: #5AB1BF;
    --orange: #FF7238;    /* accent: decoration only, too light for text on white */
    --bg: #E9F0F2;
    --paper: #FFFFFF;
    --ink: #0F2633;
    --muted: #55707C;
    --line: #D5E1E5;
    --link: #00767C;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08202C;
      --paper: #0F2E3E;
      --ink: #EAF3F5;
      --muted: #9DB8C2;
      --line: #21485B;
      --link: #5AB1BF;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.5 "Public Sans", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }

  .card {
    background: var(--paper);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,56,77,.08), 0 16px 40px -16px rgba(15,56,77,.35);
  }

  /* Navy band carrying the logomark */
  .band {
    position: relative;
    height: 112px;
    background: var(--navy);
    border-bottom: 4px solid var(--orange);
    overflow: hidden;
  }
  .band .mark {
    position: absolute;
    right: 22px; top: 22px;
    width: 52px; height: 52px;
    padding: 9px;
    background: #fff;
    border-radius: 12px;
  }

  .body { padding: 0 28px 28px; }
  .photo {
    width: 104px; height: 104px;
    border-radius: 50%;
    object-fit: cover; object-position: center 20%;
    display: block;
    margin-top: -52px;
    position: relative;
    border: 4px solid var(--paper);
    background: var(--line);
  }
  h1 {
    font-family: "Bricolage Grotesque", "Public Sans", sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 8.5vw, 2.5rem);
    line-height: 1.04;
    letter-spacing: -0.02em;
    margin: 18px 0 8px;
  }
  h1::after {
    content: "";
    display: block;
    width: 44px; height: 4px;
    margin-top: 12px;
    border-radius: 2px;
    background: var(--orange);
  }
  .role { margin: 0; font-weight: 500; }
  .role2 { margin: 0; font-weight: 300; color: #55707C;}
  .org { margin: 0; color: var(--muted); }

  ul { list-style: none; margin: 26px 0 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 2px; color: var(--ink); text-decoration: none;
  }
  li a span:first-child { color: var(--muted); }
  li a span:last-child { font-weight: 500; text-align: right; overflow-wrap: anywhere; }
  li a:hover span:last-child { color: var(--link); }

  .save {
    display: block; width: 100%;
    margin-top: 24px; padding: 16px;
    border-radius: 10px;
    background: var(--teal); color: #fff;
    font: 600 1.05rem/1 "Public Sans", sans-serif;
    text-align: center; text-decoration: none;
  }
  .save:hover { background: #00656A; }
  a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
  .note { text-align: center; color: var(--muted); font-size: .85rem; margin: 14px 0 0; }
</style>
